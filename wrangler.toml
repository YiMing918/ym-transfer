# ym-transfer 的 Cloudflare Pages 配置（示例值，部署时替换成你自己的）
# 注意：这里只写绑定名与公开变量，任何密钥真值都不进仓库，走 Pages 后台的 Secret。
# 部署步骤见 DEPLOY.md；占位值由 .github/workflows/deploy.yml 在部署时用 Secrets 替换，
# 用 Pages 连 Git 部署的人直接在后台绑定 D1/R2、填环境变量即可。
name = "ym-transfer"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

# D1 数据库绑定：代码里统一用 env.DB（存文件元数据与限流计数）
[[d1_databases]]
binding = "DB"
database_name = "ym-transfer-db"
database_id = "00000000-0000-0000-0000-000000000000"

# R2 文件桶绑定：代码里统一用 env.FILES（只用来 HEAD 校验/删除，文件本体不经过 Worker）
[[r2_buckets]]
binding = "FILES"
bucket_name = "ym-transfer-files"

[vars]
# R2 的 S3 API 端点（预签名直传用）：https://<账号ID>.r2.cloudflarestorage.com
R2_S3_ENDPOINT = "https://00000000000000000000000000000000.r2.cloudflarestorage.com"
R2_S3_BUCKET = "ym-transfer-files"
# 限制口径（单文件 5GB、站内共 10GB）写在代码里，不走环境变量：
# 后端 functions/api/upload-init.js 与 functions/api/stats.js 的常量，
# 前端 public/index.html 里的 MAX_FILE_BYTES；改限制要三处一起改。

# 以下为 Secret（在 Pages 后台 Settings → Environment variables 里以加密变量添加，不要写在这里）：
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY  —— R2 的 S3 凭据，仅用于签发预签名 URL
# TASK_SECRET                              —— 清理接口的调用密钥（GitHub Actions 定时清理用）
# IP_SALT                                  —— 可选：IP 哈希的盐，不配有默认值
