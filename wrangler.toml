# ym-transfer 的 Cloudflare Pages 配置
# 绑定（D1 / R2）与普通变量由本文件管理。接 Git 后，后台「设置 → 绑定 / 变量和密钥」
# 提示改由 wrangler.toml 管理，仪表板里加不了，所以把真实的资源值写在这里。
# 只写真实值：占位 database_id 会把绑定带到不存在的资源上。
# 密钥（R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / TASK_SECRET）不写进本文件，
# 由 GitHub Actions 的 deploy 工作流通过 wrangler 加密变量推送。
# 可选变量 IP_SALT（IP 哈希的盐）不在本文件配，有默认值。
# 部署步骤见 DEPLOY.md。

name = "ym-transfer"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

# 普通变量（生产环境）：R2 的 S3 兼容端点与存储桶
[vars]
R2_S3_ENDPOINT = "https://f86488d8e8df5d7db666c0a498292af6.r2.cloudflarestorage.com"
R2_S3_BUCKET = "ym-transfer-files"

# 绑定：Pages Functions 的 D1 数据库（变量名 DB）与 R2 存储桶（变量名 FILES）
[[d1_databases]]
binding = "DB"
database_name = "ym-transfer-db"
database_id = "017ce421-342d-4146-907b-e9524a95a45b"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ym-transfer-files"

# 限制口径（单文件 5GB、站内共 10GB）写在代码里，不走配置：
# functions/api/upload-init.js 与 functions/api/stats.js 的常量、
# public/index.html 里的 MAX_FILE_BYTES，改限制要三处一起改。
