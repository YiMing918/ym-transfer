name: deploy

# 推送到 main 或手动触发时，把站点部署到 Cloudflare Pages 并同步运行时密钥（推送即上线，改完代码不用手动碰 Cloudflare 后台）。
# 一次运行做三件事（顺序不可换）：执行 D1 迁移 → 推送 Pages 加密变量（Secret）→ 组装输出目录并部署。
# 绑定（D1 / R2）与普通变量在 Pages 后台配（见 DEPLOY.md 第 6 步），wrangler.toml 里不写绑定，本工作流也不替换任何占位值。
# 部署目录必须现场组装：public/ 是静态页，接口代码在仓库根目录的 functions/——Pages 只认部署目录里的
# functions/，直接部署 public 会把接口丢掉（/api/* 全部 404）。所以先把 public 的内容与 functions
# 拼进 _site/ 再部署，别改回只部署 public。
# 需在仓库 Settings → Secrets and variables → Actions 里加（详见 DEPLOY.md 第 8 步）：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID  —— 部署令牌与账号（必填，缺了整条流水线自动跳过）
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY       —— R2 桶的 S3 凭据（运行时 Secret，直传必需）
#   TASK_SECRET                                   —— 清理接口密钥（运行时 Secret，清理工作流也用它）

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 未配令牌时给出提示并结束
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次跳过部署（属正常：用 Pages 连 Git 部署的人不需要它们）。"
      - name: 执行 D1 迁移（建表，IF NOT EXISTS，已建过可重复跑）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx -y wrangler@3 d1 execute ym-transfer-db --remote --file=schema/0001_init.sql
          # 0002 加一列 max_downloads：列已存在时会报错，用 || true 忽略（列已存在 = 已迁移过，属正常）
          npx -y wrangler@3 d1 execute ym-transfer-db --remote --file=schema/0002_add_max_downloads.sql || echo "0002 可能已执行过（列已存在），继续"
      - name: 推送 Pages 加密变量（Secret 逐个灌入，缺哪个跳哪个）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx -y wrangler@3 pages secret put "$1" --project-name ym-transfer
            else
              echo "跳过 $1（未配置）"
            fi
          }
          put R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          put R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          put TASK_SECRET "$TASK_SECRET"
      - name: 组装输出目录并部署到 Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          rm -rf _site && mkdir _site
          cp -r public/. _site/
          cp -r functions _site/functions
          npx -y wrangler@3 pages deploy _site --project-name ym-transfer --branch main --commit-dirty=true
