name: deploy

# 推送到 main 或手动触发时，把站点部署到 Cloudflare Pages 并同步全部运行时配置（推送即上线，改完代码不用手动碰 Cloudflare 后台）。
# 一次运行做四件事（顺序不可换）：替换 wrangler.toml 的占位值 → 执行 D1 迁移 → 推送 Pages 加密变量（Secret）→ 部署。
# wrangler.toml 在仓库里只放占位值（方便他人部署时对照替换），真实值全部来自本仓库的 Actions Secrets，替换只发生在运行器内存里，不回写仓库。
# 需在仓库 Settings → Secrets and variables → Actions 里加（详见 DEPLOY.md）：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID  —— 部署令牌与账号（必填，缺了整条流水线自动跳过）
#   D1_DATABASE_ID                                —— 你的 D1 数据库 ID（必填，部署前先按 DEPLOY.md 建库）
#   R2_S3_ENDPOINT                                —— https://<账号ID>.r2.cloudflarestorage.com（选填，缺省用账号 ID 拼）
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY       —— R2 桶的 S3 凭据（运行时 Secret，直传必需）
#   TASK_SECRET                                   —— 清理接口密钥（运行时 Secret，清理工作流也用它）
# 注意：本仓库没有构建步骤（静态文件直出 + Functions 原生 ES 模块），部署的是 public/ 目录 + 根目录的 functions/，
# 别改成只部署 public/ 而丢了 functions/。

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 未配令牌时给出提示并结束
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次跳过部署（属正常：用 Pages 连 Git 部署的人不需要它们）。"
      - name: 用 Secrets 替换 wrangler.toml 的占位值（仅运行器内生效）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" wrangler.toml
          fi
          EP="$R2_S3_ENDPOINT"
          if [ -z "$EP" ]; then EP="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"; fi
          sed -i "s|https://00000000000000000000000000000000.r2.cloudflarestorage.com|$EP|" wrangler.toml
          grep -q "00000000-0000-0000-0000" wrangler.toml && echo "::warning::database_id 仍是占位值（未配 D1_DATABASE_ID），绑定将指向不存在的库" || true
      - name: 执行 D1 迁移（建表，IF NOT EXISTS，已建过可重复跑）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx -y wrangler@3 d1 execute ym-transfer-db --remote --file=schema/0001_init.sql
          # 0002 加一列 max_downloads：列已存在时会报错，用 || true 忽略（列已存在 = 已迁移过，属正常）
          npx -y wrangler@3 d1 execute ym-transfer-db --remote --file=schema/0002_add_max_downloads.sql || echo "0002 可能已执行过（列已存在），继续"
      - name: 推送 Pages 加密变量（Secret 逐个灌入，缺哪个跳哪个）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx -y wrangler@3 pages secret put "$1" --project-name ym-transfer
            else
              echo "跳过 $1（未配置）"
            fi
          }
          put R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          put R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          put TASK_SECRET "$TASK_SECRET"
      - name: 部署到 Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx -y wrangler@3 pages deploy public --project-name ym-transfer --branch main --commit-dirty=true
