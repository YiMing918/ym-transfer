# 一次运行做三件事（顺序不可换）：执行 D1 迁移 → 推送 Pages 加密变量（Secret）→ 组装输出目录并部署。
# 绑定（D1 / R2）与普通变量在 Pages 后台配（见 DEPLOY.md 第 6 步），wrangler.toml 里不写绑定，本工作流也不替换任何占位值。
# 部署目录必须现场组装：public/ 是静态页，接口代码在仓库根目录的 functions/——Pages 只认部署目录里的
# functions/，直接部署 public 会把接口丢掉（/api/* 全部 404）。所以先把 public 的内容与 functions
# 拼进 _site/ 再部署，别改回只部署 public。
# 需在仓库 Settings → Secrets and variables → Actions 里加（详见 DEPLOY.md 第 8 步）：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID  —— 部署令牌与账号（必填，缺了整条流水线自动跳过）
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY       —— R2 桶的 S3 凭据（运行时 Secret，直传必需）
#   TASK_SECRET                                   —— 清理接口密钥（运行时 Secret，清理工作流也用它）
# 部署工具 wrangler 的版本由仓库 package-lock.json 锁定（下面的 npm ci 按锁安装），不再现拉浮动版。


on:
  push:
    branches: [main]
  workflow_dispatch:


env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备 Node（跑测试用）
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 按锁文件装部署工具（版本跟仓库走）
        run: npm ci --no-audit --no-fund
      - name: 跑全套测试（不过不部署）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm test
      - name: 未配令牌时给出提示并结束
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，本次跳过部署（属正常：用 Pages 连 Git 部署的人不需要它们）。"
      - name: 执行 D1 迁移（建表，IF NOT EXISTS，已建过可重复跑）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          # 加列迁移（0002/0004/0005）统一走这个函数：先跑 ALTER，失败了不猜报错文案，
          # 直接拿 SELECT 列名探一下——列在就是已迁移过，放行；列不在才是真失败，红灯停下。
          # 这样 wrangler 换个报错写法也不会再误杀部署，真失败也不会被悄悄吞掉。
          add_column_if_missing() { # $1 迁移文件 $2 表名 $3 列名 $4 编号
            if ! out=$(./node_modules/.bin/wrangler d1 execute ym-transfer-db --remote --file="$1" 2>&1); then
              echo "$out"
              if ./node_modules/.bin/wrangler d1 execute ym-transfer-db --remote --command "SELECT $3 FROM $2 LIMIT 0;" >/dev/null 2>&1; then
                echo "$4 已执行过（列已存在），继续"
              else
                echo "::error::$4 迁移失败（列也不存在），终止部署，请先处理 D1 迁移"
                exit 1
              fi
            fi
          }
          ./node_modules/.bin/wrangler d1 execute ym-transfer-db --remote --file=schema/0001_init.sql
          # 0002 加一列 max_downloads（下载次数上限）
          add_column_if_missing schema/0002_add_max_downloads.sql files max_downloads 0002
          # 0003 删冗余索引：DROP INDEX IF EXISTS 本身幂等，可重复跑
          ./node_modules/.bin/wrangler d1 execute ym-transfer-db --remote --file=schema/0003_drop_redundant_index.sql
          # 0004 加一列 delete_token_hash（删除令牌）
          add_column_if_missing schema/0004_add_delete_token.sql files delete_token_hash 0004
          # 0005 加一列 content_md5（文件指纹）
          add_column_if_missing schema/0005_add_content_md5.sql files content_md5 0005
      - name: 推送 Pages 加密变量（Secret 逐个灌入，缺哪个跳哪个）
        # 首次运行时项目还不存在（由下一步的部署创建），灌入会失败——只容忍这一种：
        # 先查项目在不在，不在才跳过并提醒部署后再跑一次；在却灌入失败就是真故障，红灯停下，
        # 不许再无条件放行（旧写法把真失败也吞掉，密钥没灌进去照样上线还没人知道）。
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TASK_SECRET: ${{ secrets.TASK_SECRET }}
        run: |
          put() {
            if [ -z "$2" ]; then
              echo "跳过 $1（未配置）"
              return 0
            fi
            if out=$(printf '%s' "$2" | ./node_modules/.bin/wrangler pages secret put "$1" --project-name ym-transfer 2>&1); then
              echo "$1 已灌入"
            else
              echo "$out"
              if ./node_modules/.bin/wrangler pages project list 2>/dev/null | grep -q "ym-transfer"; then
                echo "::error::$1 灌入失败（项目已存在，不是首次运行），终止部署，请先处理密钥灌入"
                exit 1
              fi
              echo "::warning::$1 灌入失败：项目尚不存在（首次运行），本次跳过；部署完成后请再跑一次本工作流，密钥灌入后随第二次部署生效"
            fi
          }
          put R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          put R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          put TASK_SECRET "$TASK_SECRET"
      - name: 组装输出目录并部署到 Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          rm -rf _site && mkdir _site
          cp -r public/. _site/
          cp -r functions _site/functions
          ./node_modules/.bin/wrangler pages deploy _site --project-name ym-transfer --branch main --commit-dirty=true
